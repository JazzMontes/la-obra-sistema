<ion-header><ion-toolbar><ion-buttons slot="start"><ion-back-button defaultHref="/home"></ion-back-button></ion-buttons><ion-title>Productos</ion-title></ion-toolbar></ion-header><ion-content class="ion-padding"><ion-card><ion-card-header><ion-card-title>{{ editingId ? 'Editar producto' : 'Nuevo producto' }}</ion-card-title></ion-card-header><ion-card-content><ion-input label="Nombre" labelPlacement="stacked" [(ngModel)]="form.name"></ion-input><ion-textarea label="Descripción" labelPlacement="stacked" [(ngModel)]="form.description"></ion-textarea><ion-select label="Categoría" labelPlacement="stacked" [(ngModel)]="form.category_id"><ion-select-option *ngFor="let c of categories" [value]="c.id">{{c.name}}</ion-select-option></ion-select><ion-select label="Tipo" labelPlacement="stacked" [(ngModel)]="form.type"><ion-select-option value="prepared">Preparado</ion-select-option><ion-select-option value="resale">Reventa</ion-select-option></ion-select><ion-input type="number" label="Precio" labelPlacement="stacked" [(ngModel)]="form.price"></ion-input><ion-toggle *ngIf="editingId" [(ngModel)]="form.is_available">Disponible</ion-toggle><div class="actions ion-margin-top"><ion-button (click)="save()">Guardar</ion-button><ion-button *ngIf="editingId" fill="outline" (click)="cancel()">Cancelar</ion-button></div></ion-card-content></ion-card><ion-text color="medium"><p>{{message}}</p></ion-text><ion-list><ion-item *ngFor="let p of products"><ion-label><h2>{{p.name}} — ${{p.price}}</h2><p>{{p.category?.name || p.category_name}} · {{p.type}} · {{p.status}}</p><p>{{p.description}}</p></ion-label><ion-button fill="clear" (click)="edit(p)">Editar</ion-button><ion-button color="danger" fill="clear" *ngIf="p.status==='active'" (click)="deactivate(p.id)">Desactivar</ion-button></ion-item></ion-list></ion-content>
