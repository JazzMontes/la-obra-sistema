<ion-header><ion-toolbar><ion-buttons slot="start"><ion-back-button defaultHref="/home"></ion-back-button></ion-buttons><ion-title>Recetas</ion-title></ion-toolbar></ion-header><ion-content class="ion-padding"><ion-select label="Producto preparado" labelPlacement="stacked" [(ngModel)]="productId" (ionChange)="loadRecipe()"><ion-select-option *ngFor="let p of products" [value]="p.id">{{p.name}}</ion-select-option></ion-select><ion-card *ngFor="let row of recipeInputs; let n=index"><ion-card-content><ion-select label="Insumo" labelPlacement="stacked" [(ngModel)]="row.input_id"><ion-select-option *ngFor="let i of inputs" [value]="i.id">{{i.name}} ({{i.unit}})</ion-select-option></ion-select><ion-input type="number" label="Cantidad" labelPlacement="stacked" [(ngModel)]="row.quantity"></ion-input><ion-button color="danger" fill="clear" (click)="remove(n)">Quitar</ion-button></ion-card-content></ion-card><div class="actions"><ion-button fill="outline" (click)="add()" [disabled]="!productId">Agregar insumo</ion-button><ion-button (click)="save()" [disabled]="!productId || recipeInputs.length===0">Guardar receta</ion-button></div><p class="muted">{{message}}</p></ion-content>
