<ion-header>
  <ion-toolbar>
    <ion-title>La Obra</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <h1>Bienvenido, {{ user?.name }}</h1>

  <p>Usuario: {{ user?.username }}</p>
  <p>Rol: {{ user?.role }}</p>

  <!-- OPCIONES DEL ADMINISTRADOR -->
  <div *ngIf="user?.role === 'admin'">

    <h2>Administración</h2>

    <!-- Aún no existe una página de gestión de usuarios en este frontend -->
    <ion-button expand="block" disabled>
      Gestión de usuarios
    </ion-button>

    <ion-button expand="block" routerLink="/products">
      Productos
    </ion-button>

    <ion-button expand="block" routerLink="/categories">
      Categorías
    </ion-button>

    <ion-button expand="block" routerLink="/inputs">
      Insumos
    </ion-button>

    <!-- Estos módulos todavía no tienen páginas -->
    <ion-button expand="block" disabled>
      Compras
    </ion-button>

    <ion-button expand="block" disabled>
      Gastos
    </ion-button>

    <ion-button expand="block" routerLink="/recipes">
      Recetas y costos
    </ion-button>

    <ion-button expand="block" disabled>
      Mermas
    </ion-button>

    <ion-button expand="block" disabled>
      Cortes
    </ion-button>

  </div>

  <!-- OPCIONES DISPONIBLES PARA EMPLEADO -->
  <div *ngIf="user?.role === 'employee'">

    <h2>Punto de venta</h2>

    <ion-button expand="block" disabled>
      Nueva venta
    </ion-button>

    <ion-button expand="block" disabled>
      Cierre del día
    </ion-button>

  </div>

</ion-content>
