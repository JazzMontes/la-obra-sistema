<ion-app>
  <ion-router-outlet></ion-router-outlet>
  <ion-modal [isOpen]="diagnostics.modalOpen" (didDismiss)="diagnostics.closeModal()" class="api-error-modal">
    <ng-template>
      <ion-header>
        <ion-toolbar>
          <ion-title>Error en la solicitud</ion-title>
          <ion-buttons slot="end"><ion-button (click)="diagnostics.closeModal()">Cerrar</ion-button></ion-buttons>
        </ion-toolbar>
      </ion-header>
      <ion-content class="ion-padding api-error-content">
        <h2>No se pudo completar la operación</h2>
        <p>{{ diagnostics.modalMessage }}</p>
        <h3>Información técnica de la API</h3>
        <pre>{{ diagnostics.modalDetails }}</pre>
        <ion-button expand="block" (click)="diagnostics.closeModal()">Cerrar</ion-button>
      </ion-content>
    </ng-template>
  </ion-modal>
</ion-app>
