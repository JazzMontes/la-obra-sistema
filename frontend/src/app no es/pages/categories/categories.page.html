<ion-header><ion-toolbar><ion-buttons slot="start"><ion-back-button defaultHref="/home"></ion-back-button></ion-buttons><ion-title>Categorías</ion-title></ion-toolbar></ion-header><ion-content class="ion-padding"><ion-card><ion-card-content><ion-input label="Nombre" labelPlacement="stacked" [(ngModel)]="name"></ion-input><div class="actions ion-margin-top"><ion-button (click)="save()">{{editingId?'Actualizar':'Crear'}}</ion-button><ion-button *ngIf="editingId" fill="outline" (click)="cancel()">Cancelar</ion-button></div></ion-card-content></ion-card><p class="muted">{{message}}</p><ion-list><ion-item *ngFor="let c of categories"><ion-label>{{c.name}} <small>({{c.status}})</small></ion-label><ion-button fill="clear" (click)="edit(c)">Editar</ion-button><ion-button color="danger" fill="clear" *ngIf="c.status==='active'" (click)="deactivate(c.id)">Desactivar</ion-button></ion-item></ion-list></ion-content>
