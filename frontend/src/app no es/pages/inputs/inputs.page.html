<ion-header><ion-toolbar><ion-buttons slot="start"><ion-back-button defaultHref="/home"></ion-back-button></ion-buttons><ion-title>Insumos</ion-title></ion-toolbar></ion-header><ion-content class="ion-padding"><ion-card><ion-card-content><ion-input label="Nombre" labelPlacement="stacked" [(ngModel)]="form.name"></ion-input><ion-input label="Unidad (kg, g, ml, pieza...)" labelPlacement="stacked" [(ngModel)]="form.unit"></ion-input><div class="actions ion-margin-top"><ion-button (click)="save()">{{editingId?'Actualizar':'Crear'}}</ion-button><ion-button *ngIf="editingId" fill="outline" (click)="cancel()">Cancelar</ion-button></div></ion-card-content></ion-card><p class="muted">{{message}}</p><ion-list><ion-item *ngFor="let i of inputs"><ion-label><h2>{{i.name}}</h2><p>{{i.unit}} · {{i.status}}</p></ion-label><ion-button fill="clear" (click)="edit(i)">Editar</ion-button><ion-button color="danger" fill="clear" *ngIf="i.status==='active'" (click)="deactivate(i.id)">Desactivar</ion-button></ion-item></ion-list></ion-content>
